<header role="banner">
  <div class="site-topbar">
    <div class="site-shell">
      <a class="site-brand" href="{{ "/" | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="{{ "/" | relative_url }}">Articles</a>
        <a href="{{ "/about/" | relative_url }}">About</a>
        <a href="https://github.com/{{ site.github_username }}/Development-Adventures">Source</a>
      </nav>
    </div>
  </div>

  <div class="site-masthead site-shell">
    <div class="masthead-panel">
      <div class="site-eyebrow">Development log</div>
      <div class="site-title">{{ site.title }}</div>
      <p class="site-description">{{ site.description | strip }}</p>
    </div>
  </div>
</header>
