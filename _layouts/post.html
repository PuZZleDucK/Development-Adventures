---
layout: default
---
<article class="post-panel" itemscope itemtype="http://schema.org/BlogPosting">
  <header class="post-header">
    <div class="post-kicker">Development adventure</div>
    <h1 class="post-title" itemprop="headline">{{ page.title | escape }}</h1>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%d %B %Y" }}</time>
      {% if page.source_url %}<a href="{{ page.source_url }}">Original Blogger post ↗</a>{% endif %}
    </div>
  </header>
  <div class="post-content" itemprop="articleBody">
    {{ content }}
  </div>
</article>

{% if site.disqus.shortname %}{% include disqus_comments.html %}{% endif %}
